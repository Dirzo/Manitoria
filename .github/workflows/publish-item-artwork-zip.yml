name: Publish item artwork ZIP
on:
  push:
    paths:
      - .github/workflows/publish-item-artwork-zip.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package 90 item artworks
        run: |
          count=$(find godot/assets/items -maxdepth 1 -type f -name '*.png' | wc -l)
          test "$count" -eq 90
          cd godot/assets/items
          zip -j "$GITHUB_WORKSPACE/Manitoria-90-item-artworks.zip" ./*.png
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create item-artworks-90-2026-10-05 Manitoria-90-item-artworks.zip --title "90 item artworks" --notes "Downloadable archive of all 90 new Manitoria item PNG artworks." --target "$GITHUB_SHA"
